version: '2'
sql:
- engine: postgresql
  schema: ./internal/db/migrations
  database:
    uri: ${DB_URL}
  queries: ./internal/db/query
  gen:
    go:
      emit_json_tags: true
      emit_interface: true
      emit_pointers_for_null_types: true
      emit_result_struct_pointers: true
      json_tags_case_style: camel
      package: repository
      out: internal/db/repository
      sql_package: pgx/v5
      overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
      - column: wallets.address
        go_struct_tag: binding:"required" example:"SP1Y5YSTAHZ88XYK1VPDH24GY0HPX5J4JECTMY4A1"
      - column: user_wallets.wallet_address
        go_struct_tag: binding:"required" example:"SP1Y5YSTAHZ88XYK1VPDH24GY0HPX5J4JECTMY4A1"
      - column: user_wallets.nickname
        go_struct_tag: binding:"required" example:"iatomic"
      - column: watchlist.ca
        go_struct_tag: binding:"required" example:"SP1Y5YSTAHZ88XYK1VPDH24GY0HPX5J4JECTMY4A1.velar-token"
      - column: alerts.metric
        go_struct_tag: binding:"required"
      - column: alerts.operator
        go_struct_tag: binding:"required"
      - column: alerts.value
        go_struct_tag: binding:"required"
      - column: alerts.ca
        go_struct_tag: binding:"required" example:"SP1Y5YSTAHZ88XYK1VPDH24GY0HPX5J4JECTMY4A1.velar-token"
      - column: alerts.repeatable
        go_type:
          type: "bool"
          pointer: true
        go_struct_tag: 'binding:"required"'
      - column: alerts.status
        go_struct_tag: binding:"required"
